<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Quiz Hub · University of Kalba · Dr. Arun Korath</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#04040c;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#cfd3ff}
  canvas{display:block}
  #ui{position:fixed;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(10,10,24,.55);backdrop-filter:blur(8px);border:1px solid rgba(140,150,255,.18);border-radius:12px;padding:10px 12px;font-size:13px;max-width:calc(100vw - 28px);z-index:5}
  button{background:#161a3a;color:#dfe3ff;border:1px solid #3a4190;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{background:#222870} button.on{background:#4a55ff;border-color:#6d77ff;color:#fff}
  label{display:flex;align-items:center;gap:6px;opacity:.9} input[type=range]{width:90px}
  #title{position:fixed;left:0;right:0;bottom:12vh;text-align:center;pointer-events:none;z-index:4;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
  #title div{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
  #title div.show{opacity:1;transform:none}
  #l1{font-size:clamp(11px,1.4vw,14px);letter-spacing:.42em;text-transform:uppercase;color:#8fb3ff;font-weight:500}
  #l2{font-family:"Syne",ui-sans-serif,sans-serif;font-weight:800;font-size:clamp(34px,6.2vw,76px);line-height:1.05;margin:10px 0 14px;letter-spacing:-.01em;
      background:linear-gradient(180deg,#ffffff 0%,#dbe8ff 45%,#7adcff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 0 18px rgba(122,220,255,.35))}
  #l3{display:inline-block;font-size:clamp(12px,1.7vw,18px);letter-spacing:.28em;text-transform:uppercase;color:#7adcff;font-weight:600;padding-top:14px;position:relative}
  #l3::before{content:"";position:absolute;left:50%;top:0;width:64px;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#7adcff,transparent)}
  #hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;pointer-events:none;white-space:nowrap}

  #title{bottom:30vh}
  #ui{display:none}
  #ui.open{display:flex}
  #gear{position:fixed;left:14px;bottom:14px;z-index:6;background:rgba(10,10,24,.55);border:1px solid rgba(140,150,255,.25);border-radius:10px;padding:7px 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#aab3ff}
  #gear.hide{display:none}
  #mute{position:fixed;right:14px;top:14px;z-index:7;width:42px;height:42px;border-radius:50%;background:rgba(10,10,24,.6);border:1px solid rgba(140,150,255,.3);font-size:18px;padding:0;display:none;align-items:center;justify-content:center}
  #mute.show{display:flex}
  #enter{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7vh;gap:10px;cursor:pointer;background:linear-gradient(180deg,rgba(4,4,12,0) 35%,rgba(4,4,12,.55) 70%,rgba(4,4,12,.9) 100%);transition:opacity .8s ease}
  #enter.gone{opacity:0;pointer-events:none}
  #enter .u{font-size:clamp(11px,1.3vw,13px);letter-spacing:.5em;text-transform:uppercase;color:#8fb3ff}
  #enter .h{font-family:"Syne",sans-serif;font-weight:800;font-size:clamp(24px,3.6vw,44px);letter-spacing:-.01em;color:#fff;text-shadow:0 0 30px rgba(122,220,255,.45);text-align:center;line-height:1.05}
  #enter .p{margin-top:12px;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:clamp(14px,1.8vw,20px);letter-spacing:.35em;text-transform:uppercase;color:#04040c;background:linear-gradient(90deg,#7adcff,#b48cff);padding:16px 38px;border-radius:999px;box-shadow:0 0 0 0 rgba(122,220,255,.6);animation:pulse 1.6s ease-out infinite}
  #enter .s{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(122,220,255,.55)}100%{box-shadow:0 0 0 26px rgba(122,220,255,0)}}
  #cta{position:fixed;left:0;right:0;bottom:9vh;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;z-index:5;padding:0 16px}
  #cta a{opacity:0;transform:translateY(22px) scale(.96);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1.2),box-shadow .25s,border-color .25s;pointer-events:none;
    display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;padding:16px 26px 16px 20px;border-radius:16px;min-width:250px;
    background:rgba(12,14,40,.62);backdrop-filter:blur(10px);border:1px solid rgba(140,150,255,.3);box-shadow:0 10px 40px rgba(0,0,0,.45)}
  #cta a.show{opacity:1;transform:none;pointer-events:auto}
  #cta a:nth-child(2){transition-delay:.18s}
  #cta a .k{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#1f2a7a,#3b2d8f)}
  #cta a.student .k{background:linear-gradient(135deg,#0ea5a0,#2563eb)}
  #cta a.teacher .k{background:linear-gradient(135deg,#f59e0b,#ef4444)}
  #cta a b{display:block;font-family:"Syne",sans-serif;font-size:19px;letter-spacing:.01em}
  #cta a small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fb0ff;margin-top:2px}
  #cta a:hover{border-color:#7adcff;box-shadow:0 0 0 2px rgba(122,220,255,.35),0 14px 50px rgba(122,220,255,.25);transform:translateY(-3px)}
  #cta a.go{transform:scale(1.08);border-color:#fff}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:#fff;opacity:0}
  @media (max-height:640px){#title{bottom:34vh}#cta{bottom:4vh}#cta a{padding:10px 16px;min-width:200px}#cta a b{font-size:16px}}
</style>
</head>

const U = {
  uMap:{value:null}, uTime:{value:0}, uProgress:{value:0}, uDepth:{value:1}, uDensity:{value:0.45}, uSize:{value:3},
  uTint:{value:new THREE.Color(0.5,0.85,1.0)}, uMode:{value:0}, uMeshAlpha:{value:0.28}
};
const common = `
uniform sampler2D uMap; uniform float uTime, uProgress, uDepth;
attribute vec3 scatter; attribute float rnd;
varying vec2 vUv; varying float vLum; varying float vMask; varying float vRnd; varying vec3 vN; varying vec3 vView; varying float uProgressF;
float ease(float t){ return t<.5 ? 4.*t*t*t : 1.-pow(-2.*t+2.,3.)/2.; }
vec3 modelPos(vec2 uv){
  vec3 m = texture2D(uMap, uv).rgb;
  float z = m.g * 150.0 * uDepth;
  return vec3((uv.x-.5)*300.0, (uv.y-.5)*300.0*(346.0/256.0), z);
}`;
const vertPts = common + `
uniform float uSize;
void main(){
  vUv = uv; vec3 m = texture2D(uMap, uv).rgb; vLum = m.r; vMask = m.b; vRnd = rnd;
  vec3 h = modelPos(uv);
  float p = ease(clamp(uProgress + (rnd-.5)*.3, 0., 1.));
  vec3 pos = mix(scatter, h, p);
  float t = uTime*.7 + rnd*6.28;
  pos += vec3(sin(t*1.3), cos(t*1.1), sin(t*.9)) * (1.0 + 25.0*(1.0-p));
  vec4 mv = modelViewMatrix * vec4(pos,1.);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = uSize * (1.6 + rnd) * (420.0 / -mv.z) * (0.5 + 0.8*vLum);
}`;
const fragPts = `
uniform vec3 uTint; uniform float uDensity; uniform float uProgress;
varying float vLum; varying float vMask; varying float vRnd;
void main(){
  if(vMask < .5) discard;
  if(vRnd > uDensity) discard;
  vec2 c = gl_PointCoord-.5; float d = length(c); if(d>.5) discard;
  float a = smoothstep(.5,.08,d);
  vec3 col = mix(vec3(1.,.35,.9), vec3(.25,.85,1.), vLum) * (1.0-uProgress) + uTint * (0.15+1.1*vLum) * uProgress;
  gl_FragColor = vec4(col * (0.9 + 1.1*vLum), a);
}`;
const vertMesh = common + `
void main(){
  vUv = uv; vec3 m = texture2D(uMap, uv).rgb; vLum = m.r; vMask = m.b; vRnd = rnd;
  vec3 h = modelPos(uv);
  float p = ease(clamp(uProgress + (rnd-.5)*.3, 0., 1.));
  vec3 pos = mix(scatter, h, p);
  // normal from depth gradient
  float e = 1.0/256.0;
  float zl = texture2D(uMap, uv-vec2(e,0.)).g, zr = texture2D(uMap, uv+vec2(e,0.)).g;
  float zd = texture2D(uMap, uv-vec2(0.,e)).g, zu = texture2D(uMap, uv+vec2(0.,e)).g;
  vN = normalize(normalMatrix * normalize(vec3(-(zr-zl)*40.0*uDepth/(300.0*e*2.0), -(zu-zd)*40.0*uDepth/(405.0*e*2.0), 1.0)));
  vec4 mv = modelViewMatrix * vec4(pos,1.); vView = -mv.xyz; uProgressF = uProgress;
  gl_Position = projectionMatrix * mv;
}`;
const fragMesh = `
uniform vec3 uTint; uniform float uTime; uniform float uMode; uniform float uMeshAlpha;
varying vec2 vUv; varying float vLum; varying float vMask; varying vec3 vN; varying vec3 vView; varying float uProgressF;
void main(){
  if(vMask < .5) discard;
  float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vView))), 2.0);
  float scan = 0.85 + 0.15*sin(gl_FragCoord.y*0.9 + uTime*6.0);
  float grain = fract(sin(dot(vUv*vec2(812.3,431.7)+uTime, vec2(12.9898,78.233)))*43758.5453);
  vec3 col = uTint * (0.05 + 0.85*vLum) * scan * (0.9 + 0.2*grain) + vec3(.6,.9,1.) * fres * 0.45;
  float alpha = uMode > 1.5 ? 0.35 : (uMode > 0.5 ? 0.9 : uMeshAlpha * smoothstep(0.85, 1.0, uProgressF));
  gl_FragColor = vec4(col, alpha * vMask);
}`;

const SEG_X = 120, SEG_Y = 162;
function addScatter(geo){
  const n = geo.attributes.position.count, sc = new Float32Array(n*3), rnd = new Float32Array(n);
  for(let i=0;i<n;i++){ const th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1), r=350+Math.random()*350;
    sc[i*3]=r*Math.sin(ph)*Math.cos(th); sc[i*3+1]=r*Math.sin(ph)*Math.sin(th); sc[i*3+2]=r*Math.cos(ph); rnd[i]=Math.random(); }
  geo.setAttribute('scatter', new THREE.BufferAttribute(sc,3)); geo.setAttribute('rnd', new THREE.BufferAttribute(rnd,1));
}
const geoP = new THREE.PlaneGeometry(1,1,SEG_X,SEG_Y); addScatter(geoP);
const geoM = new THREE.PlaneGeometry(1,1,SEG_X,SEG_Y); addScatter(geoM);
const matP = new THREE.ShaderMaterial({uniforms:U, vertexShader:vertPts, fragmentShader:fragPts, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
const matM = new THREE.ShaderMaterial({uniforms:U, vertexShader:vertMesh, fragmentShader:fragMesh, transparent:true, side:THREE.DoubleSide});
const matW = new THREE.ShaderMaterial({uniforms:U, vertexShader:vertMesh, fragmentShader:fragMesh, transparent:true, wireframe:true, blending:THREE.AdditiveBlending, depthWrite:false});
const pts = new THREE.Points(geoP, matP), mesh = new THREE.Mesh(geoM, matM), wire = new THREE.Mesh(geoM, matW);
const group = new THREE.Group(); group.add(pts, mesh, wire); group.position.y = 45; scene.add(group);
wire.visible=false;
new THREE.TextureLoader().load(TEX, tx=>{ tx.minFilter=THREE.LinearFilter; tx.magFilter=THREE.LinearFilter; U.uMap.value=tx; });

// UI
let mode='dots', spin=true, target=1, introT=-1;
const setMode = m=>{ mode=m; pts.visible = m==='dots'; mesh.visible = (m==='holo' || m==='dots'); wire.visible = m==='wire';
  U.uMode.value = m==='wire'?2:(m==='holo'?1:0);
  for(const id of ['m-dots','m-wire','m-holo']) document.getElementById(id).classList.toggle('on', id==='m-'+m); };
document.getElementById('m-dots').onclick=()=>setMode('dots');
document.getElementById('m-wire').onclick=()=>setMode('wire');
document.getElementById('m-holo').onclick=()=>setMode('holo');
document.getElementById('spin').onclick=e=>{ spin=!spin; e.target.classList.toggle('on',spin); };
document.getElementById('density').oninput=e=>U.uDensity.value=+e.target.value;

document.getElementById('depth').oninput=e=>U.uDepth.value=+e.target.value;
const L=[document.getElementById('l1'),document.getElementById('l2'),document.getElementById('l3')];
const vo=document.getElementById('vo');

/* ===================== ROCK SOUND ENGINE (procedural, WebAudio) ===================== */
let AC=null, master, musicGain, dist, gLP, duck, muted=false, beat=0, beatFlash=0, musicOn=false;
const NOTE={E2:82.41,G2:98,A2:110,B2:123.47,C3:130.81,D3:146.83,E3:164.81,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66};
function makeDist(k){const n=8192,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x));}return c;}
function noiseBuf(){const n=AC.sampleRate*1.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
let NB;
function audioInit(){
  if(AC) return; AC=new (window.AudioContext||window.webkitAudioContext)(); NB=noiseBuf();
  master=AC.createGain(); master.gain.value=.9;
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=8; comp.attack.value=.004; comp.release.value=.18;
  master.connect(comp); comp.connect(AC.destination);
  duck=AC.createGain(); duck.gain.value=1; duck.connect(master);
  musicGain=AC.createGain(); musicGain.gain.value=0; musicGain.connect(duck);
  dist=AC.createWaveShaper(); dist.curve=makeDist(90); dist.oversample='4x';
  const pre=AC.createBiquadFilter(); pre.type='highpass'; pre.frequency.value=90;
  gLP=AC.createBiquadFilter(); gLP.type='lowpass'; gLP.frequency.value=3200; gLP.Q.value=.8;
  const cab=AC.createBiquadFilter(); cab.type='peaking'; cab.frequency.value=900; cab.gain.value=4; cab.Q.value=1.2;
  const gg=AC.createGain(); gg.gain.value=.16;
  pre.connect(dist); dist.connect(gLP); gLP.connect(cab); cab.connect(gg); gg.connect(musicGain); dist.inp=pre;
}
function powerChord(f,t,dur,vel=1,mute=false){
  const g=AC.createGain(); g.connect(dist.inp);
  const a=.006, s=mute?Math.min(dur,.14):dur;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+a); g.gain.setTargetAtTime(vel*(mute?.0:.7),t+a,mute?.05:.4); g.gain.setTargetAtTime(0,t+s,.03);
  [[f,-5],[f,5],[f*1.5,0],[f*2,3]].forEach(([fr,det])=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.detune.value=det;o.connect(g);o.start(t);o.stop(t+s+.3);});
}
function bass(f,t,dur){
  const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;g.connect(lp);lp.connect(musicGain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.01);g.gain.setTargetAtTime(0,t+dur-.05,.05);
  const o=AC.createOscillator();o.type='square';o.frequency.value=f/2;o.connect(g);o.start(t);o.stop(t+dur+.2);
}
function kick(t,v=1){
  const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
  g.gain.setValueAtTime(v*1.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.45);
  const c=AC.createOscillator(),cg=AC.createGain();c.type='square';c.frequency.value=900;cg.gain.setValueAtTime(.15*v,t);cg.gain.exponentialRampToValueAtTime(.001,t+.02);c.connect(cg);cg.connect(musicGain);c.start(t);c.stop(t+.03);
  setTimeout(()=>{beat=1;},Math.max(0,(t-AC.currentTime)*1000));
}
function noiseHit(t,hp,bpq,dur,v){
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=hp?'highpass':'bandpass';f.frequency.value=bpq[0];f.Q.value=bpq[1];
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+dur+.05);
}
function snare(t,v=1){noiseHit(t,false,[1900,.7],.2,.9*v);noiseHit(t,true,[5000,1],.12,.5*v);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.08);g.gain.setValueAtTime(.6*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.15);}
function hat(t,open){noiseHit(t,true,[7500,1],open?.28:.05,open?.3:.22);}
function crash(t,v=1){noiseHit(t,true,[4200,.5],1.6,.9*v);noiseHit(t,false,[9000,.8],1.2,.4*v);}
function boom(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(30,t+1.2);g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+1.5);}
function riser(t,dur){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(180,t);f.frequency.exponentialRampToValueAtTime(5200,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.55,t+dur);g.gain.setValueAtTime(0,t+dur+.01);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+dur+.05);
  const o=AC.createOscillator(),og=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(220,t+dur);og.gain.setValueAtTime(.001,t);og.gain.exponentialRampToValueAtTime(.25,t+dur);og.gain.setValueAtTime(0,t+dur+.01);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(300,t);lp.frequency.exponentialRampToValueAtTime(4000,t+dur);o.connect(lp);lp.connect(og);og.connect(musicGain);o.start(t);o.stop(t+dur+.05);
}
function blip(){ if(!AC||muted) return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+.06);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(master);o.start(t);o.stop(t+.14); }
/* ---- the riff: 120 bpm, eighth notes. [note, eighths, palm-mute] ---- */
const BPM=124, E8=60/BPM/2;
const RIFF=[['E3',1,1],['E3',1,1],['E3',1,1],['G3',1,0],['E3',1,1],['E3',1,1],['A3',1,0],['G3',1,0],
            ['E3',1,1],['E3',1,1],['E3',1,1],['G3',1,0],['D4',1,0],['C4',1,0],['B3',1,0],['A3',1,0],
            ['E3',1,1],['E3',1,1],['E3',1,1],['G3',1,0],['E3',1,1],['E3',1,1],['A3',1,0],['G3',1,0],
            ['C4',2,0],['D4',2,0],['E3',1,1],['E3',1,1],['G3',2,0]];
const RIFFLEN=RIFF.reduce((a,r)=>a+r[1],0);
let step=0, nextT=0, timer=null, riffPos=0, riffAcc=0;
function scheduleStep(t,i){
  const b=i%8; // 8 eighths per bar
  if(b===0||b===4||b===7) kick(t,b===0?1:.85);
  if(b===2||b===6) snare(t);
  hat(t,b===7);
  if(i%32===0) crash(t,.6);
  // guitar + bass
  if(riffAcc===0){ const [n,len,pm]=RIFF[riffPos]; const f=NOTE[n]; powerChord(f,t,len*E8,1,pm); bass(f,t,len*E8); riffAcc=len; riffPos=(riffPos+1)%RIFF.length; }
  riffAcc--;
}
function startMusic(at){
  if(musicOn) return; musicOn=true; step=0; riffPos=0; riffAcc=0; nextT=at;
  timer=setInterval(()=>{ while(nextT<AC.currentTime+.15){ scheduleStep(nextT,step); step++; nextT+=E8; } },30);
}
function stopMusic(fade=.5){ if(!AC) return; clearInterval(timer); musicOn=false; musicGain.gain.cancelScheduledValues(AC.currentTime); musicGain.gain.setTargetAtTime(0,AC.currentTime,fade/3); }
function setMuted(m){ muted=m; document.getElementById('mute').textContent=m?'🔇':'🔊'; vo.muted=m; if(master) master.gain.setTargetAtTime(m?0:.9,AC.currentTime,.05); }
function playIntro(){
  introT = performance.now(); U.uProgress.value = 0; target = 1; L.forEach(l=>l.classList.remove('show'));
  document.querySelectorAll('#cta a').forEach(a=>a.classList.remove('show'));
  camera.position.set(0,0,900); controls.target.set(0,0,0);
  if(AC){
    const t0=AC.currentTime+.05; stopMusic(.05);
    riser(t0,2.5);
    const hit=t0+2.55; crash(hit); boom(hit); kick(hit); powerChord(NOTE.E3,hit,1.4,1.1,false); bass(NOTE.E3,hit,1.4);
    musicGain.gain.cancelScheduledValues(t0); musicGain.gain.setValueAtTime(0,t0); musicGain.gain.linearRampToValueAtTime(.95,t0+.4);
    setTimeout(()=>{ flashScreen(); }, 2550);
    // name reveal stinger
    const st=t0+3.5; crash(st,.8); powerChord(NOTE.G3,st,1.2,1,false); bass(NOTE.G3,st,1.2);
    setTimeout(()=>{ flashScreen(.5); }, 3500);
    // riff kicks in on the next downbeat
    startMusic(t0+5.2); duck.gain.setValueAtTime(.45,t0+2.6);
  }
  setTimeout(()=>{ try{ vo.currentTime=0; vo.play().catch(()=>{}); }catch(e){} }, 2600);
  setTimeout(()=>L[0].classList.add('show'), 2600);
  setTimeout(()=>L[1].classList.add('show'), 3500);
  setTimeout(()=>L[2].classList.add('show'), 5300);
  setTimeout(()=>{ document.querySelectorAll('#cta a').forEach(a=>a.classList.add('show')); document.getElementById('gear').classList.remove('hide'); }, 6400);
}
function flashScreen(a=.9){ const f=document.getElementById('flash'); f.style.transition='none'; f.style.opacity=a; void f.offsetHeight; requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transition='opacity .9s ease'; f.style.opacity=0; })); setTimeout(()=>{ f.style.transition='none'; f.style.opacity=0; },1500); beatFlash=1; }
vo.addEventListener('ended',()=>{ if(AC) duck.gain.setTargetAtTime(1,AC.currentTime,.4); });
vo.addEventListener('play',()=>{ if(AC) duck.gain.setTargetAtTime(.45,AC.currentTime,.1); });
/* ---- entry gate (unlocks audio) ---- */
const enterEl=document.getElementById('enter');
enterEl.addEventListener('click',()=>{
  audioInit(); AC.resume(); enterEl.classList.add('gone'); document.getElementById('mute').classList.add('show');
  introT=-1; target=0; L.forEach(l=>l.classList.remove('show'));
  if(AC){ const t=AC.currentTime; noiseHit(t,true,[3000,.6],.7,.8); boom(t); musicGain.gain.setValueAtTime(.9,t); }
  setTimeout(playIntro,900);
},{once:true});
document.getElementById('mute').onclick=()=>setMuted(!muted);
document.getElementById('gear').onclick=()=>document.getElementById('ui').classList.toggle('open');
document.querySelectorAll('#cta a').forEach(a=>{
  a.addEventListener('mouseenter',blip);
  a.addEventListener('click',e=>{
    e.preventDefault(); const href=a.getAttribute('href'); a.classList.add('go');
    if(AC){ const t=AC.currentTime; crash(t); kick(t); powerChord(NOTE.E3,t,.9,1.1,false); powerChord(NOTE.E3*2,t+.02,.9,.7,false); stopMusic(.6); }
    flashScreen(.7); setTimeout(()=>{ location.href=href; }, 650);
  });
});
document.getElementById('play').onclick = playIntro;
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime(); U.uTime.value=t;
  if(introT>0){ const s=(performance.now()-introT)/1000; U.uProgress.value = Math.min(1, s/2.4); }
  else U.uProgress.value += (target - U.uProgress.value)*0.04;
  if(spin) group.rotation.y = 0.55*Math.sin(t*0.45); else group.rotation.y += (0 - group.rotation.y)*0.02;
  group.rotation.x = 0.06*Math.sin(t*0.7);
  beat*=0.9; beatFlash*=0.92;
  U.uSize.value = (+document.getElementById('psize').value) * (1 + .45*beat);
  U.uTint.value.setRGB(0.5+0.5*beatFlash, 0.85+0.15*beatFlash, 1.0);
  camera.fov = 40 - 2.5*beat; camera.updateProjectionMatrix();
  controls.update(); renderer.render(scene, camera);
}
target=1; U.uProgress.value=0; introT=performance.now();
loop();
</script>
