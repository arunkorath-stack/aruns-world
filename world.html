addEventListener('pointerup', () => drag = null);
addEventListener('keydown', e => { if(!started) return; if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { e.preventDefault(); jump(1); } if(e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); jump(-1); } });
function nearestIdx(v){ let b=0, bd=9; stops.forEach((s,i)=>{ const d=Math.abs(s.t - v); if(d<bd){bd=d;b=i;} }); return b; }
function jump(dir){ const i = clamp(nearestIdx(target) + dir, 0, stops.length-1); setTarget(stops[i].t); click(); }
$('#next').onclick = () => jump(1); $('#prev').onclick = () => jump(-1);
// dock
const dots = $('#dots'); stops.forEach((s,i)=>{ const b=document.createElement('button'); b.className='d'; b.dataset.t = s.title; b.onclick=()=>{ setTarget(s.t); click(); }; dots.appendChild(b); });
// intro
$('#intro').addEventListener('click', () => { started = true; $('#intro').classList.add('gone'); audioStart(); setTimeout(()=>setTarget(stops[0].t), 300); }, {once:true});

/* ===================== CARD ===================== */
const card = $('#card');
function showStop(i){ if(i===activeIdx) return; activeIdx = i; if(i<0){ card.classList.remove('show'); return; } const s = stops[i]; card.innerHTML = `<div class="n">${s.n}</div><h2>${s.title}</h2>${s.html}`; card.classList.remove('show'); void card.offsetHeight; card.classList.add('show'); chime(i); [...dots.children].forEach((d,k)=>{ d.classList.toggle('on', k===i); d.classList.toggle('done', k<i); }); }

/* ===================== DAY / NIGHT ===================== */
function applyMode(){ const T = night ? NIGHT : DAY; for(const k in T){ if(typeof T[k]==='number' && k!=='exp' && !['sunI','hemiI'].includes(k)){ cur[k] = T[k]; } } }
let mix = 0; // 0 day, 1 night
$('#mode').onclick = () => { night = !night; document.documentElement.classList.toggle('night', night); $('#mode').textContent = night ? '☀️' : '🌙'; click(); };
const tmpA = new THREE.Color(), tmpB = new THREE.Color();
function lerpCol(a, b, k){ return tmpA.set(a).lerp(tmpB.set(b), k).clone(); }

/* ===================== SOUND (procedural ambience) ===================== */
let AC = null, master, on = false;
function audioStart(){ if(AC) return; try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  // sea: filtered noise with slow swell
  const n = AC.sampleRate*4, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; const src = AC.createBufferSource(); src.buffer = b; src.loop = true; const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 600; const g = AC.createGain(); g.gain.value = .18; const lfo = AC.createOscillator(); lfo.frequency.value = .11; const lg = AC.createGain(); lg.gain.value = .08; lfo.connect(lg); lg.connect(g.gain); lfo.start(); src.connect(lp); lp.connect(g); g.connect(master); src.start();
  // pad: slow chords
  const padG = AC.createGain(); padG.gain.value = .05; const plp = AC.createBiquadFilter(); plp.type='lowpass'; plp.frequency.value = 900; padG.connect(plp); plp.connect(master);
  const chords = [[220,277.2,329.6],[196,246.9,293.7],[174.6,220,261.6],[164.8,207.7,246.9]]; let ci = 0; const oscs = chords[0].map(f=>{ const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=f; const o2=AC.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.003; o.connect(padG); o2.connect(padG); o.start(); o2.start(); return [o,o2]; });
  setInterval(()=>{ ci=(ci+1)%chords.length; chords[ci].forEach((f,i)=>{ oscs[i][0].frequency.setTargetAtTime(f, AC.currentTime, 1.2); oscs[i][1].frequency.setTargetAtTime(f*2.003, AC.currentTime, 1.2); }); }, 7000);
  setOn(true); }
function setOn(v){ on = v; $('#snd').textContent = on ? '🔊' : '🔈'; if(master) master.gain.setTargetAtTime(on ? .9 : 0, AC.currentTime, .3); }
$('#snd').onclick = () => { if(!AC) audioStart(); else setOn(!on); };
function click(){ if(!AC||!on) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(660,t); o.frequency.exponentialRampToValueAtTime(880,t+.05); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.12); o.connect(g); g.connect(master); o.start(t); o.stop(t+.13); }
function chime(i){ if(!AC||!on) return; const t=AC.currentTime; [0,.09,.18].forEach((d,k)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value = [523.3,659.3,784][k] * (1 + i*.02); g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.14,t+d+.01); g.gain.exponentialRampToValueAtTime(.001,t+d+.7); o.connect(g); g.connect(master); o.start(t+d); o.stop(t+d+.75); }); }

/* ===================== LOOP ===================== */
const camPos = new THREE.Vector3(), look = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); } addEventListener('resize', resize); resize();
const scopeTmp = new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame); const dt = Math.min(.05, (now - lastT)/1000); lastT = now; const t = now/1000;
  // progress easing
  P += (target - P) * (1 - Math.pow(.0025, dt)); vel = (target - P);
  // boat along the curve
  const bp = curve.getPointAt(clamp(P,0,1)), tan = curve.getTangentAt(clamp(P,0,1));
  boat.position.set(bp.x, .35 + Math.sin(t*1.6)*.18, bp.z); boat.rotation.y = Math.atan2(-tan.z, tan.x); boat.rotation.z = Math.sin(t*1.1)*.05 + vel*-.5; boat.rotation.x = Math.cos(t*1.3)*.03;
  wake.material.opacity = .08 + Math.min(.3, Math.abs(vel)*6);
  // camera: behind and above, drift toward the active island
  const idx = nearestIdx(P); const s = stops[idx]; const near = Math.abs(s.t - P) < .045;
  const back = tan.clone().multiplyScalar(-22); camPos.set(bp.x + back.x, 13, bp.z + back.z);
  if(near){ const toI = s.pos.clone().sub(bp); const n = new THREE.Vector3(-tan.z,0,tan.x).multiplyScalar(-s.side*10); camPos.add(n).add(tan.clone().multiplyScalar(-4)); camPos.y = 15; }
  camera.position.lerp(camPos, 1 - Math.pow(.02, dt));
  look.set(bp.x, 3, bp.z).add(tan.clone().multiplyScalar(10)); if(near) look.lerp(new THREE.Vector3(s.pos.x, 5, s.pos.z), .6);
  const curLook = camera.userData.look || (camera.userData.look = look.clone()); curLook.lerp(look, 1 - Math.pow(.03, dt)); camera.lookAt(curLook);
  sunTarget.position.copy(bp); sun.position.set(bp.x + 120, 160, bp.z + 60);
  showStop(started && near ? idx : -1);
  $('#pct').textContent = Math.round(P*100) + '%';
  // day/night mixing
  mix += ((night?1:0) - mix) * (1 - Math.pow(.1, dt));
  skyMat.uniforms.top.value.copy(lerpCol(DAY.sky, NIGHT.sky, mix)); skyMat.uniforms.bot.value.copy(lerpCol(DAY.horizon, NIGHT.horizon, mix));
  scene.fog.color.copy(lerpCol(DAY.fog, NIGHT.fog, mix)); waterU.fogColor.value.copy(scene.fog.color);
  waterU.c1.value.copy(lerpCol(DAY.water, NIGHT.water, mix)); waterU.c2.value.copy(lerpCol(DAY.deep, NIGHT.deep, mix)); waterU.foam.value.copy(lerpCol(DAY.foam, NIGHT.foam, mix));
  hemi.color.copy(lerpCol(DAY.hemi, NIGHT.hemi, mix)); hemi.groundColor.copy(lerpCol(DAY.ground, NIGHT.ground, mix)); hemi.intensity = DAY.hemiI + (NIGHT.hemiI - DAY.hemiI)*mix;
  sun.color.copy(lerpCol(DAY.sun, NIGHT.sun, mix)); sun.intensity = DAY.sunI + (NIGHT.sunI - DAY.sunI)*mix; renderer.toneMappingExposure = DAY.exp + (NIGHT.exp - DAY.exp)*mix;
  stars.material.opacity = mix; disc.material.color.copy(lerpCol(0xfff4c2, 0xdfe8ff, mix));
  winMats.forEach(m => m.emissiveIntensity = mix * 1.4); M.win.emissiveIntensity = mix*1.4;
  waterU.t.value = t;
  // animated bits
  scene.traverse(o => { const u = o.userData; if(!u) return; if(u.spin) o.rotation.y = t*.8; if(u.gear) o.rotation.z = t*u.gear; if(u.scope) o.rotation.y = Math.sin(t*.3)*.6; if(u.beam) o.rotation.y = t*.9; if(u.blink) o.material.emissiveIntensity = (Math.sin(t*4)>0)?1.5:.1; if(u.bulb) o.material.emissiveIntensity = .5 + .4*Math.sin(t*2.2) + mix; if(u.lap){ const a = -t*1.1; o.position.set(Math.cos(a)*5, .05, Math.sin(a)*5); o.rotation.y = -a - Math.PI/2; } if(typeof u.float==='number') o.position.y = 6 + u.float*.6 + Math.sin(t*1.5 + u.float)*.5, o.rotation.y = t*.6 + u.float; });
  clouds.forEach(c => { c.position.x += c.userData.v * dt * 3; if(c.position.x > 380) c.position.x = -380; });
  birds.forEach(b => { const u = b.userData; u.a += dt*.5; b.position.set(u.c.x + Math.cos(u.a)*u.R, u.y + Math.sin(t*2)*1.2, u.c.z + Math.sin(u.a)*u.R); b.rotation.y = -u.a; const f = Math.sin(t*9 + u.R)*.6; u.l.rotation.z = f; u.r.rotation.z = -f; });
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
}
